  <style>
      body {
          font-family: 'Segoe UI', sans-serif;
          background-color: black;
          margin: 0;
          padding: 0;
      }
      .container {
          max-width: 390px;
          margin: 20px auto;
          background: black;
          border-radius: 9px;
          box-shadow: 0 0 10px 
            rgba(0,0,0,0.1);
          overflow: hidden;
      }
      .header {

      }

          color: white;

      }
      .message {
          margin: 7px 0;
          padding: 7px 12px;
          border-radius: 15px;
          max-width: 60%;
      }
      .message.user {
          background: red;
          color: white;
          margin-left: auto;
      }
      .message.ai {
          background: blue;
          color: white;
      }
      .input-area {
          display: flex;
          padding: 15px;
          border-top: 1px solid #016;
      }
      input {
          flex: 1;
          padding: 9px;
          border: 3px solid #ddd;
          border-radius: 30px;
          margin-right: 20px;
      }
      button {
          background: red;
          color: black;
          border: none;
          padding: 10px 10px;
          border-radius: 40%;
          cursor: pointer;
      }
  </style>
</head>

  function sendMessage() {
    const input = document.getElementById('question');
    const chat = document.getElementById('chat');
    const msg = input.value.trim();
    if (msg) {
      chat.innerHTML += `<div class="message user">${msg}</div>`;
      chat.scrollTop = chat.scrollHeight;
      setTimeout(() => {
        let reponse = getReponse(msg);
        chat.innerHTML += `<div class="message ai">${reponse}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 500);
      input.value = '';
    }
  }
     function getReponse(question) {
            question = question.toLowerCase();
            for (let q in data) {
                let questions = q.toLowerCase().split('|');
                for (let i = 0; i < questions.length; i++) {
                    if (question.includes(questions[i].trim())) {
                        return data[q];
                    }
                }
 
  }
  
              if (question.includes('merci') || question.includes('mrc')) {
                  return 'Je t\'en prie as-tu d\'autres questions du genre?';
                
              } else {

              }
