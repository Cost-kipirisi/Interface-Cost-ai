*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    linear-gradient(135deg,#000000,#120000,#001133);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:430px;
    height:95vh;
    background:rgba(10,10,10,0.95);
    border:2px solid rgba(255,0,0,0.4);
    border-radius:25px;
    overflow:hidden;
    box-shadow:
    0 0 30px rgba(255,0,0,0.3),
    0 0 60px rgba(0,0,255,0.2);
    backdrop-filter:blur(10px);
    position:relative;
}

.container::before{
    content:'';
    position:absolute;
    width:200px;
    height:200px;
    background:red;
    border-radius:50%;
    top:-80px;
    right:-80px;
    opacity:0.2;
    filter:blur(50px);
}

.container::after{
    content:'';
    position:absolute;
    width:200px;
    height:200px;
    background:blue;
    border-radius:50%;
    bottom:-80px;
    left:-80px;
    opacity:0.2;
    filter:blur(50px);
}

.header{
    background:linear-gradient(90deg,#ff0000,#0011ff);
    padding:18px;
    text-align:center;
    position:relative;
    z-index:2;
}

.header h1{
    color:white;
    font-size:24px;
    letter-spacing:2px;
}

.header p{
    color:#ddd;
    margin-top:5px;
    font-size:12px;
}

.chat{
    height:73vh;
    overflow-y:auto;
    padding:15px;
    scroll-behavior:smooth;
    position:relative;
    z-index:2;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:red;
    border-radius:20px;
}

.message{
    max-width:80%;
    padding:12px 15px;
    margin:12px 0;
    border-radius:18px;
    animation:fade .4s ease;
    line-height:1.5;
    word-wrap:break-word;
}

@keyframes fade{
    from{
        transform:translateY(10px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.user{
    background:linear-gradient(135deg,#ff0000,#770000);
    color:white;
    margin-left:auto;
    border-bottom-right-radius:5px;
}

.ai{
    background:linear-gradient(135deg,#003cff,#001244);
    color:white;
    border-bottom-left-radius:5px;
}

.input-area{
    position:absolute;
    bottom:0;
    width:100%;
    display:flex;
    padding:15px;
    gap:10px;
    background:rgba(0,0,0,0.9);
    border-top:1px solid rgba(255,255,255,0.1);
    z-index:2;
}

.input-area input{
    flex:1;
    padding:15px;
    border:none;
    outline:none;
    border-radius:50px;
    background:#111;
    color:white;
    font-size:15px;
    border:2px solid rgba(255,255,255,0.1);
}

.input-area input:focus{
    border:2px solid red;
    box-shadow:0 0 15px rgba(255,0,0,0.4);
}

.input-area button{
    width:55px;
    border:none;
    border-radius:50%;
    background:linear-gradient(135deg,red,blue);
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.input-area button:hover{
    transform:scale(1.1);
}

.power{
    text-align:center;
    color:#999;
    font-size:11px;
    margin-top:5px;
}

.typing{
    color:#aaa;
    font-size:13px;
    margin-top:5px;
}

.glow{
    color:#fff;
    text-shadow:
    0 0 5px red,
    0 0 10px red,
    0 0 20px blue;
}

function sendMessage(){

const input = document.getElementById("question");
const chat = document.getElementById("chat");

let msg = input.value.trim();

if(msg === "") return;

chat.innerHTML += `
<div class="message user">${msg}</div>
`;

chat.scrollTop = chat.scrollHeight;

input.value = "";

setTimeout(()=>{

let response = getResponse(msg);

chat.innerHTML += `
<div class="message ai">${response}</div>
`;

chat.scrollTop = chat.scrollHeight;

},700);

}

function getResponse(question){

question = question.toLowerCase();

for(let key in data){

let mots = key.split("|");

for(let mot of mots){

if(question.includes(mot.trim())){

return data[key];

}

}

}

return randomResponses[
Math.floor(Math.random()*randomResponses.length)
];

}

document.getElementById("question")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

sendMessage();

}

});
